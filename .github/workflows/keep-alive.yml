name: Keep-Alive Render Service

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Render service
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 https://aldexcapital.onrender.com/health
